name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t sahilyadavteche/chat-app:latest .

      - name: Push Docker Image
        run: |
          docker push sahilyadavteche/chat-app:latest

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pull latest image..."
            docker pull sahilyadavteche/chat-app:latest

            echo "Stop old container..."
            docker stop chat-app || true
            docker rm chat-app || true

            docker stop chat-app-container || true
            docker rm chat-app-container || true

            echo "Run new container..."
            docker run -d \
              --restart unless-stopped \
              --name chat-app \
              -p 4000:4000 \
              sahilyadavteche/chat-app:latest

            echo "Container status..."
            docker ps -a